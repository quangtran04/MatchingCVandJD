[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-jd-matching"
version = "0.1.0"
description = "Extract structured CV data and explain CV-to-JD matching"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "pymupdf>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "rapidfuzz>=3.10,<4.0",
  "spacy>=3.8,<4.0",
  "structlog>=24.4,<26.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.3,<4.0"]
worker = ["celery>=5.4,<6.0", "redis>=5.2,<6.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
